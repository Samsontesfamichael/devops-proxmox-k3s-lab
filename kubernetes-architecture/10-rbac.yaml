apiVersion: v1
kind: ServiceAccount
metadata:
  name: enterprise-app-sa
  namespace: enterprise-apps

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: enterprise-app-role
  namespace: enterprise-apps
rules:
  - apiGroups: [""]
    resources: ["configmaps", "secrets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods", "services"]
    verbs: ["get", "list"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: enterprise-app-rb
  namespace: enterprise-apps
subjects:
  - kind: ServiceAccount
    name: enterprise-app-sa
    namespace: enterprise-apps
roleRef:
  kind: Role
  name: enterprise-app-role
  apiGroup: rbac.authorization.k8s.io
