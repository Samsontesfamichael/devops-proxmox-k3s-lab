apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: isolate-database-tier
  namespace: enterprise-apps
spec:
  podSelector:
    matchLabels:
      app: mysql
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: web-test
      ports:
        - protocol: TCP
          port: 3306
    - from:
        - podSelector:
            matchLabels:
              app: config-test
      ports:
        - protocol: TCP
          port: 3306