apiVersion: apps/v1
kind: Deployment
metadata:
  name: self-healing-web
  namespace: enterprise-apps
spec:
  replicas: 2
  selector:
    matchLabels:
      app: resilient-web
  template:
    metadata:
      labels:
        app: resilient-web
    spec:
      containers:
        - name: nginx
          image: nginx:alpine
          ports:
            - containerPort: 80
          resources:
            limits:
              memory: "64Mi"
              cpu: "100m"
            requests:
              memory: "32Mi"
              cpu: "50m"
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10