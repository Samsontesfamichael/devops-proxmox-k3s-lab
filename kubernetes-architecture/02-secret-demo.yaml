apiVersion: apps/v1
kind: Deployment
metadata:
  name: secret-demo-app
  namespace: enterprise-apps
spec:
  replicas: 1
  selector:
    matchLabels:
      app: secret-test
  template:
    metadata:
      labels:
        app: secret-test
    spec:
      containers:
        - name: backend-service
          image: alpine:3.18
          command:
            - "/bin/sh"
            - "-c"
            - "echo 'Ingested encrypted parameter verification!' && sleep 3600"
          resources:
            limits:
              memory: "32Mi"
              cpu: "50m"
            requests:
              memory: "16Mi"
              cpu: "25m"
          env:
            - name: DB_PASS
              valueFrom:
                secretKeyRef:
                  name: enterprise-vault
                  key: MYSQL_PASSWORD