- name: Create enterprise-apps namespace
  kubernetes.core.k8s:
    name: enterprise-apps
    kind: Namespace
    kubeconfig: /etc/rancher/k3s/k3s.yaml
    state: present

- name: Create enterprise-vault secret from vault variables
  kubernetes.core.k8s:
    state: present
    kubeconfig: /etc/rancher/k3s/k3s.yaml
    namespace: enterprise-apps
    resource_definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: enterprise-vault
      stringData:
        MYSQL_ROOT_PASSWORD: "{{ vault_mysql_root_password }}"
        MYSQL_PASSWORD: "{{ vault_mysql_password }}"
        POSTGRES_PASSWORD: "{{ vault_postgres_password }}"
        FILEBROWSER_PASSWORD: "{{ vault_filebrowser_password }}"
  no_log: true
