- name: Update apt cache
  apt:
    update_cache: yes
    cache_valid_time: 3600

- name: Install required packages
  apt:
    name:
      - curl
      - ca-certificates
      - tar
      - gnupg
      - python3
      - python3-pip
    state: present

- name: Install kubernetes Python client for Ansible k8s modules
  pip:
    name: kubernetes
    executable: pip3
  environment:
    PIP_DISABLE_PIP_VERSION_CHECK: "1"

- name: Ensure /dev/kmsg exists for LXC nested containers
  file:
    src: /dev/console
    dest: /dev/kmsg
    state: link
    force: yes
  ignore_errors: true

- name: Download and install K3s server on master
  shell: |
    curl -sfL https://get.k3s.io | INSTALL_K3S_EXEC=server K3S_KUBECONFIG_MODE=644 sh -s -
  args:
    creates: /usr/local/bin/k3s
  when: "'master' in group_names"
  register: k3s_server_install

- name: Wait for server node-token to appear
  wait_for:
    path: /var/lib/rancher/k3s/server/node-token
  when: "'master' in group_names"

- name: Slurp server join token
  slurp:
    src: /var/lib/rancher/k3s/server/node-token
  when: "'master' in group_names"
  register: server_token_b64

- name: Set k3s_token fact
  set_fact:
    k3s_token: "{{ server_token_b64.content | b64decode | trim }}"
  when: "'master' in group_names"

- name: Install K3s agent on workers and join cluster
  shell: |
    curl -sfL https://get.k3s.io | \
      K3S_URL=https://{{ hostvars[groups['master'][0]].ansible_host }}:6443 \
      K3S_TOKEN={{ hostvars[groups['master'][0]].k3s_token }} \
      sh -
  args:
    creates: /usr/local/bin/k3s-agent-uninstall.sh
  when: "'workers' in group_names"
  register: k3s_agent_install

- name: Ensure k3s service is enabled and started
  systemd:
    name: "{{ 'k3s' if 'master' in group_names else 'k3s-agent' }}"
    enabled: yes
    state: started
  ignore_errors: true
