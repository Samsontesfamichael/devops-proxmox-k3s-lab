- name: Ensure rancher config directory exists
  file:
    path: /etc/rancher/k3s
    state: directory
    mode: '0755'

- name: Deploy k3s image garbage collection config
  copy:
    dest: /etc/rancher/k3s/config.yaml
    content: |
      kubelet-arg:
        - "image-gc-high-threshold=65"
        - "image-gc-low-threshold=50"
    mode: '0644'
  notify: Restart k3s

- name: Ensure k3s service is restarted after config change
  systemd:
    name: "{{ 'k3s' if 'master' in group_names else 'k3s-agent' }}"
    state: restarted
  listen: Restart k3s
